<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#b4befe"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- glow accent ring -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="#89b4fa" stroke-opacity="0.18" stroke-width="10"/>

  <!-- central hub ring -->
  <circle cx="64" cy="64" r="30" fill="none" stroke="url(#ring)" stroke-width="6"/>

  <!-- spokes: 3 providers + 1 clients to a central gateway -->
  <g stroke="#cdd6f4" stroke-width="4.5" stroke-linecap="round" opacity="0.92">
    <line x1="64" y1="34" x2="64" y2="44"/>
    <line x1="90.1" y1="79" x2="81.4" y2="74"/>
    <line x1="37.9" y1="79" x2="46.6" y2="74"/>
  </g>

  <!-- nodes on the ring: green (healthy), blue (active), amber (queued) -->
  <circle cx="64" cy="34"    r="7.5" fill="#a6e3a1" stroke="#1e1e2e" stroke-width="2"/>
  <circle cx="90.1" cy="79" r="7.5" fill="#89b4fa" stroke="#1e1e2e" stroke-width="2"/>
  <circle cx="37.9" cy="79" r="7.5" fill="#f9e2af" stroke="#1e1e2e" stroke-width="2"/>

  <!-- center: the gateway itself -->
  <circle cx="64" cy="64" r="11" fill="#cdd6f4" stroke="#1e1e2e" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="4" fill="#89b4fa"/>
</svg>

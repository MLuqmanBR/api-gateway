[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "api-gateway-app"
version = "0.1.0"
description = "Native Linux desktop client for the api-gateway dashboard"
readme = "README-app.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyQt6>=6.6",
    "httpx[http2]>=0.27",
]

[project.optional-dependencies]
dev = [
    # Tests are unittest-style (`make test` uses `unittest discover`), but CI
    # runs them via pytest (.github/workflows/ci.yml: `pytest tests/`), so the
    # dependency stays (audit L104).
    "pytest>=8",
    "pyinstaller>=6.0",
]
charts = [
    "PyQt6-Charts>=6.6",
]

[project.gui-scripts]
api-gateway = "api_gateway_app.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
api_gateway_app = ["py.typed"]

[tool.setuptools.data-files]
"share/api-gateway-app/resources/systemd" = ["resources/systemd/api-gateway.service"]
"share/api-gateway-app/resources/desktop" = ["resources/desktop/api-gateway.desktop"]
"share/api-gateway-app/resources/icons" = ["resources/icons/api-gateway.svg"]
